[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lipid-docking-benchmark"
description = "Benchmark pipeline for evaluating lipid docking predictions (Boltz vs Vina) using RMSD and contact metrics."
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jackson Stempel" },
  { name = "Micholas Smith" },
]
keywords = ["lipid", "docking", "benchmark", "structural-biology", "computational-chemistry"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.13",
  "gemmi>=0.7",
  "rdkit>=2025.03.3",
  "biopython>=1.84",
  "pandamap>=4.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
plot = [
  "pandas>=2.3",
  "matplotlib>=3.10",
  "scienceplots>=2.2",
  "cmocean>=4.0",
]
analysis = [
  "pandas>=2.3",
  "matplotlib>=3.10",
  "scienceplots>=2.2",
  "cmocean>=4.0",
  "openpyxl>=3.1",
]
dev = [
  "pandas>=2.3",
  "matplotlib>=3.10",
  "scienceplots>=2.2",
  "cmocean>=4.0",
  "openpyxl>=3.1",
]

[project.scripts]
lipid-benchmark = "lipid_benchmark.cli:main"
lipid-benchmark-tui = "lipid_benchmark.tui:main"

[tool.setuptools]
packages = ["lipid_benchmark"]
