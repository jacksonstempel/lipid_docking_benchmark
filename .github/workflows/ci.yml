name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLCONFIGDIR: /tmp/matplotlib
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[analysis]"

      - name: Run unit and integration tests
        run: |
          python -m unittest

  reproduce-paper:
    runs-on: ubuntu-latest
    env:
      MPLCONFIGDIR: /tmp/matplotlib
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[analysis]"

      - name: Run public manuscript reproduction workflow
        run: |
          python scripts/reproduce_paper.py

  artifact-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure generated output directories are not tracked
        run: |
          tracked_output="$(git ls-files 'output/**' 'output/*' | wc -l)"
          tracked_cache="$(git ls-files '.cache/**' '.cache/*' | wc -l)"
          if [ "$tracked_output" -ne 0 ] || [ "$tracked_cache" -ne 0 ]; then
            echo "Tracked generated artifacts detected under output/ or .cache/."
            git ls-files 'output/**' 'output/*' '.cache/**' '.cache/*'
            exit 1
          fi
